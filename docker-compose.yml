services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecopark
      POSTGRES_USER: ecopark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecopark}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecopark -d ecopark"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ecopark:${POSTGRES_PASSWORD:-ecopark}@postgres:5432/ecopark
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
